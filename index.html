<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>website sekolah - sign up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Sign Up</h1>
        <p>Welcome to CHIS Cyber School</p>

        <form id="signupForm">
            <!-- Name -->
            <div class="input-group">
                <input type="text" id="fullName" name="fullName" required>
                <label for="fullName">Full Name</label>
            </div>

            <!-- Gender -->
            <div class="input-group">
                <span>Gender</span>
                <div class="gender">
                    <label>
                        <input type="radio" name="gender" value="male">
                        <span>Male</span>
                    </label>
                    <label>
                        <input type="radio" name="gender" value="female">
                        <span>Female</span>
                    </label>
                </div>
            </div>

            <!-- Email -->
            <div class="input-group">
                <input type="email" id="email" name="email" required>
                <label for="email">Email</label>
            </div>

            <!-- Password -->
            <div class="input-group">
                <input type="password" id="password" required>
                <label for="password">Password</label>
                <img src="icon/hide.svg" alt="showpw" class="eye-icon" onclick="togglePassword('password', this)">
            </div>

            <!-- Confirm Password -->
            <div class="input-group">
                <input type="password" id="confirmPassword" required>
                <label for="confirmPassword">Confirm Password</label>
                <img src="icon/hide.svg" alt="showpw" class="eye-icon" onclick="togglePassword('confirmPassword', this)">
            </div>

            <!-- Button Submit -->
            <button type="submit">Submit</button>

            <!-- Go Sign in -->
            <div class="footer">
                Already have account? <a href="./sign-in.html">Sign in here</a>
            </div>
        </form>
    </div>

    <div class="popup-overlay" id="popup">
        <div class="popup-box">
            <h3>Ups!</h3>
            <p id="popupMessage"></p>
            <button onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        function togglePassword(id, img){
            const input = document.getElementById(id);

            if(input.type === "password"){
                input.type = "text";
                img.src = "icon/show.svg";
            } else {
                input.type = "password";
                img.src = "icon/hide.svg";
            }
        }

        document.getElementById("signupForm").addEventListener("submit", e => {
            e.preventDefault(); 

            const fullname = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const confirm = document.getElementById("confirmPassword").value.trim();
            const gender = document.querySelector('input[name="gender"]:checked');

            if(!fullname || !email || !password || !confirm || !gender){
                showPopup("Semua field wajib diisi!");
                return;
            }

            if(password.length < 8){
                showPopup("Password minimal 8 karakter!");
                return;
            }

            if(password !== confirm){
                showPopup("Password dan Confirm Password tidak sama!");
                return;
            }

            window.location.href = "registration.html";
        });

        function showPopup(message){
            document.getElementById("popupMessage").innerText = message;
            document.getElementById("popup").style.display = "flex";
        }

        function closePopup(){
            document.getElementById("popup").style.display = "none";
        }
    </script>
</body>
</html>
